spring:
  application:
    name: survey
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sss}
    username: ${DB_USER:sss}
    password: ${DB_PASSWORD:sss_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  config:
    import: optional:file:../../.env[.properties]
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/sss}